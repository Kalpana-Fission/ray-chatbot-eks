apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-sentiment-cluster
spec:
  rayVersion: "2.52.0"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    idleTimeoutSeconds: 60
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.52.0
            env:
              - name: GEMINI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: gemini-api-key
                    key: api-key
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "1536Mi"
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
              - containerPort: 8000
                name: serve
            volumeMounts:
              - mountPath: /tmp/ray
                name: log-volume
        volumes:
          - name: log-volume
            emptyDir: {}
  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 3
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.52.0
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              volumeMounts:
                - mountPath: /tmp/ray
                  name: log-volume
          volumes:
            - name: log-volume
              emptyDir: {}
